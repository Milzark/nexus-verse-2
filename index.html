 whip(l){const p=g.p,t=near(p.x,p.y,90);if(!t){g.wt.whip=.15;return}g.wt.whip=cdx(1-l*.03);const a=Math.atan2(t.y-p.y,t.x-p.x),L=60+4*l;g.fx.push({x:p.x,y:p.y-4,a,L,t:.18,k:3});for(const e of g.en){const ex=e.x-p.x,ey=e.y-p.y,d=Math.hypot(ex,ey)||1;if(d<L+e.r&&!e.dead&&(ex*Math.cos(a)+ey*Math.sin(a))/d>.1)hurt(e,10+l*4,ex/d,ey/d,80)}snd(500,.06,'sawtooth')},
 hammer(l){const p=g.p,t=near(p.x,p.y,160);if(!t){g.wt.hammer=.2;return}g.wt.hammer=cdx(2.2-l*.07);g.zn.push({k:'m',x:t.x,y:t.y,r:28+2*l,t:.4,d:30+8*l})},
 goldsword(l){const p=g.p,t=near(p.x,p.y,130);if(!t){g.wt.goldsword=.15;return}g.wt.goldsword=cdx(1.5-l*.05);const a=Math.atan2(t.y-p.y,t.x-p.x),ca=Math.cos(a),sa=Math.sin(a),L=100+5*l;g.fx.push({k:5,pts:[[p.x,p.y-6],[p.x+ca*L,p.y-6+sa*L]],t:.2});for(const e of g.en){const ex=e.x-p.x,ey=e.y-p.y,pr=ex*ca+ey*sa,pe=Math.abs(-ex*sa+ey*ca);if(pr>-8&&pr<L&&pe<e.r+14&&!e.dead)hurt(e,16+l*5,ca,sa,90)}},
 iceburst(l){const p=g.p;g.wt.iceburst=cdx(3-l*.1);const rad=60+8*l;g.fx.push({x:p.x,y:p.y,r:0,mx:rad,t:.3,k:2,c:'#aee8ff'});for(const e of g.en){const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<rad+e.r&&!e.dead){hurt(e,12+4*l,0,0,0);e.sl=2.5}}snd(900,.2,'triangle')},
 grassknot(l){const p=g.p,t=near(p.x,p.y,170);if(!t){g.wt.grassknot=.2;return}g.wt.grassknot=cdx(2.5-l*.08);g.zn.push({k:'t',x:t.x,y:t.y,r:12+l*.5,t:6,d:8+3*l,tk:0})},
 shadowhex(l){const p=g.p,t=near(p.x,p.y,180);if(!t){g.wt.shadowhex=.2;return}g.wt.shadowhex=cdx(2-l*.06);t.hx=4;t.hxd=6+2*l;g.fx.push({k:5,pts:[[p.x,p.y-6],[t.x,t.y]],t:.2})},
 rocket(l){const p=g.p,t=near(p.x,p.y,260);if(!t){g.wt.rocket=.2;return}g.wt.rocket=cdx(2.2-l*.08);const a=Math.atan2(t.y-p.y,t.x-p.x);g.pr.push({x:p.x,y:p.y-4,vx:Math.cos(a)*170,vy:Math.sin(a)*170,d:30+10*l,pc:1,t:2,h:[],sz:5,col:'rgba(255,140,40,.6)',in:'#ffd040',ex:50+8*l});snd(150,.2,'sawtooth')},
 bombsquad(l){const p=g.p;g.wt.bombsquad=cdx(3-l*.1);for(let i=0;i<3+(l>>1);i++)g.zn.push({k:'m',x:p.x+rr(-90,90),y:p.y+rr(-70,70),r:34,t:.6+i*.15,d:40+10*l})},
 fireburst(l){const p=g.p;g.wt.fireburst=cdx(3-l*.1);const n=10+l;for(let i=0;i<n;i++){const a=i*TAU/n;g.pr.push({x:p.x,y:p.y-4,vx:Math.cos(a)*120,vy:Math.sin(a)*120,d:12+4*l,pc:1,t:.9,h:[],sz:4,col:'rgba(255,100,30,.6)',in:'#ffb040',ex:24})}},
 orbital(l){const p=g.p;if(!g.en.length){g.wt.orbital=.3;return}g.wt.orbital=cdx(6-l*.2);for(let i=0;i<2+(l>>2);i++){const t=near(p.x+rr(-60,60),p.y+rr(-60,60),260);if(t)g.zn.push({k:'m',x:t.x,y:t.y,r:60+5*l,t:1.2+i*.2,d:150+30*l})}snd(70,.4,'sawtooth',.07)}};
const _newW=newW;newW=function(k,l){if(g.wt[k]>0)return;if(NW2[k]){NW2[k](l);return}_newW(k,l)};
accDraw=function(){};
shopCar=function(T){meta.cu=meta.cu||{};T.insertAdjacentHTML('beforeend',`<h2>CAR UPGRADES</h2><p style='font-size:8px'>Cannot be upgraded during a run.</p><div class='row'>${CARU.map(([k,n,d])=>{const l=meta.cu[k]||0,c=150*(l+1);return`<div class='card'><b>${n}</b><small>${d}</small><small>LV ${l}/5</small><button data-cu='${k}' data-c='${c}' ${l>=5||meta.c<c?'disabled':''}>${l>=5?'MAX':'\u25c6'+c}</button></div>`}).join('')}</div>`);T.querySelectorAll('[data-cu]').forEach(b=>b.onclick=()=>{const c=+b.dataset.c,k=b.dataset.cu;if(meta.c>=c){meta.c-=c;meta.cu[k]=(meta.cu[k]||0)+1;sv('ts_meta',meta);rtab()}});return true};
</script></body></html>
